<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daily settlement report · Pull Request #231</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --fg: #1f2328; --muted: #59636e; --border: #d1d9e0; --border-muted: #d1d9e0b3; --canvas: #fff; --subtle: #f6f8fa;
    --accent: #0969da; --success: #1f883d; --danger: #d1242f; --done: #8250df;
    --add-bg: #dafbe1; --add-num: #aceebb; --del-bg: #ffebe9; --del-num: #ffcecb; --hunk-bg: #ddf4ff; --hunk-num: #b6e3ff;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; color: var(--fg); background: var(--canvas); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; cursor: pointer; }
  code, pre { font-family: var(--mono); font-size: 12px; }

  .topbar { background: #f6f8fa; border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; gap: 10px; }
  .topbar svg { fill: var(--fg); }
  .crumbs { font-size: 16px; }
  .crumbs b { font-weight: 600; }
  .repo-tabs { display: flex; gap: 4px; padding: 0 24px; border-bottom: 1px solid var(--border); background: #f6f8fa; }
  .repo-tabs span { padding: 8px 12px; color: var(--fg); border-bottom: 2px solid transparent; }
  .repo-tabs span.on { border-color: #fd8c73; font-weight: 600; }

  .wrap { max-width: 1280px; margin: 0 auto; padding: 24px; }
  h1.title { font-size: 32px; font-weight: 400; margin: 0 0 8px; }
  h1.title .num { color: var(--muted); font-weight: 300; }
  .meta { display: flex; align-items: center; gap: 8px; color: var(--muted); padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .state { background: var(--success); color: #fff; border-radius: 2em; padding: 5px 12px; font-weight: 500; display: inline-flex; gap: 4px; align-items: center; }

  .pr-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin: 16px 0 24px; }
  .pr-tabs button { background: none; border: 1px solid transparent; border-bottom: 0; padding: 8px 16px; border-radius: 6px 6px 0 0; color: var(--muted); margin-bottom: -1px; }
  .pr-tabs button.on { color: var(--fg); border-color: var(--border); background: var(--canvas); font-weight: 600; }
  .counter { background: #818b981f; border-radius: 2em; padding: 0 6px; font-size: 12px; margin-left: 4px; color: var(--fg); }
  .diffstat { margin-left: auto; align-self: center; font-size: 12px; }

  /* conversation */
  .timeline { max-width: 900px; }
  .tl-item { display: flex; gap: 16px; margin-bottom: 16px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-weight: 600; }
  .box { border: 1px solid var(--border); border-radius: 6px; flex: 1; min-width: 0; background: var(--canvas); }
  .box-h { background: var(--subtle); border-bottom: 1px solid var(--border); padding: 8px 16px; border-radius: 6px 6px 0 0; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .box-h b { color: var(--fg); }

  .md h2 { font-size: 1.5em; border-bottom: 1px solid var(--border-muted); padding-bottom: .3em; }

  .files-layout { display: grid; grid-template-columns: 280px 1fr; gap: 24px; align-items: start; }

  .tree a { display: flex; gap: 6px; padding: 4px 12px; color: var(--fg); align-items: center; }
  .tree a:hover { background: var(--subtle); text-decoration: none; }

  table.diff col.num { width: 50px; } table.diff col.mk { width: 22px; }

  td.num { color: var(--muted); text-align: right; user-select: none; position: relative; cursor: pointer; }

  tr.add td.code, tr.add td.mk { background: var(--add-bg); } tr.add td.num { background: var(--add-num); }
  tr.del td.code, tr.del td.mk { background: var(--del-bg); } tr.del td.num { background: var(--del-num); }

  .add-btn { position: absolute; left: -12px; top: 1px; width: 20px; height: 18px; border-radius: 6px; border: 0; background: var(--accent); color: #fff; font-weight: 700; line-height: 18px; padding: 0; display: none; z-index: 1; }

  .cmt { padding: 12px 16px; border-bottom: 1px solid var(--border-muted); }
  .cmt:last-child { border-bottom: 0; }
  .cmt-h { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; color: var(--muted); font-size: 13px; }

  .link-btn { background: none; border: 0; color: var(--muted); padding: 2px 6px; border-radius: 6px; font-size: 12px; }
  .link-btn:hover { background: var(--subtle); color: var(--accent); }
  .link-btn.del:hover { color: var(--danger); }
  .mini-avatar { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-size: 10px; font-weight: 600; }
  .form { padding: 12px 16px; background: var(--canvas); }
  .form .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; align-items: center; }
  .form .hint { margin-right: auto; color: var(--muted); font-size: 12px; }
  .reply { padding: 8px 16px; background: var(--subtle); border-top: 1px solid var(--border-muted); border-radius: 0 0 6px 6px; }
  .reply input { width: 100%; padding: 5px 12px; border: 1px solid var(--border); border-radius: 6px; font: inherit; background: var(--canvas); }

  .orphans { border: 1px solid #d4a72c66; background: #fff8c5; border-radius: 6px; padding: 12px 16px; margin-bottom: 16px; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--fg); color: #fff; padding: 8px 16px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; } .toast.err { background: var(--danger); }
  .hidden { display: none !important; }

</style>

<script>
const ME = 'You';
const state = { files: [], description: '', review: { verdict: 'Comment', summary: '', comments: [], other: '' }, openForm: null };

// ---------- helpers ----------
const $ = (sel, el = document) => el.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fileId = (path) => 'diff-' + path.replace(/[^a-zA-Z0-9]/g, '-');
const lineKey = (file, side, line) => `${file}|${side}|${line}`;
function avatar(name, size = 40) {
  const colors = ['#8250df', '#0969da', '#1f883d', '#bf3989', '#bc4c00'];
  const color = colors[[...name].reduce((a, c) => a + c.charCodeAt(0), 0) % colors.length];
  return size >= 40
    ? `<div class="avatar" style="background:${color}">${esc(name[0])}</div>`
    : `<span class="mini-avatar" style="background:${color}">${esc(name[0])}</span>`;
}
let toastTimer;
function toast(msg, isError = false) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.className = 'toast'), 2200);
}

// ---------- tiny, escaping markdown renderer ----------
function inline(text) {
  const codes = [];
  let s = text.replace(/`([^`]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`);
  s = esc(s)
    .replace(/\\([\\`*_#\[\]()-])/g, '$1')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^\w*])\*([^*\s][^*]*?)\*(?!\w)/g, '$1<em>$2</em>')
    .replace(/(^|[^\w])_([^_\s][^_]*?)_(?!\w)/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, label, href) => {
      const safe = /^(https?:\/\/|\.{0,2}\/|#)/.test(href) || !/^[a-z][a-z0-9+.-]*:/i.test(href);
      return safe ? `<a href="${href}" target="_blank" rel="noopener">${label}</a>` : label;
    });
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[i])}</code>`);
}
function markdown(src) {
  const lines = src.replace(/\r\n/g, '\n').split('\n');
  const out = [];
  let para = [], list = null;
  const flushPara = () => { if (para.length) out.push(`<p>${inline(para.join(' '))}</p>`); para = []; };
  const flushList = () => { if (list) out.push(`<${list.tag}>${list.items.map((i) => `<li>${inline(i)}</li>`).join('')}</${list.tag}>`); list = null; };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    let m;
    if ((m = /^```/.exec(line))) {
      flushPara(); flushList();
      const code = [];
      while (++i < lines.length && !/^```/.test(lines[i])) code.push(lines[i]);
      out.push(`<pre><code>${esc(code.join('\n'))}</code></pre>`);
    } else if ((m = /^(#{1,6})\s+(.*)$/.exec(line))) {
      flushPara(); flushList();
      out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`);
    } else if ((m = /^\s*[-*]\s+(.*)$/.exec(line)) || (m = /^\s*\d+[.)]\s+(.*)$/.exec(line))) {
      flushPara();
      const tag = /^\s*\d/.test(line) ? 'ol' : 'ul';
      if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] }; }
      list.items.push(m[1]);
    } else if (!line.trim()) {
      flushPara(); flushList();
    } else if (list && /^\s{2,}\S/.test(line)) {
      list.items[list.items.length - 1] += ' ' + line.trim();
    } else {
      flushList();
      para.push(line.trim());
    }
  }
  flushPara(); flushList();
  return out.join('\n');
}

// ---------- unified diff parser ----------
function parseDiff(text) {
  const files = [];
  let file = null, oldNo = 0, newNo = 0;
  for (const raw of text.replace(/\r\n/g, '\n').split('\n')) {
    let m;
    if ((m = /^diff --git a\/(.+) b\/(.+)$/.exec(raw))) {
      file = { path: m[2], status: 'modified', rows: [], add: 0, del: 0 };
      files.push(file);
    } else if (!file) {
      continue;
    } else if (/^new file mode/.test(raw)) file.status = 'added';
    else if (/^deleted file mode/.test(raw)) file.status = 'deleted';
    else if (/^(index |--- |\+\+\+ |similarity |rename )/.test(raw) && !file.rows.length) continue;
    else if ((m = /^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@(.*)$/.exec(raw))) {
      oldNo = +m[1]; newNo = +m[2];
      file.rows.push({ type: 'hunk', text: raw });
    } else if (raw.startsWith('+')) { file.rows.push({ type: 'add', newNo: newNo++, text: raw.slice(1) }); file.add++; }
    else if (raw.startsWith('-')) { file.rows.push({ type: 'del', oldNo: oldNo++, text: raw.slice(1) }); file.del++; }
    else if (raw.startsWith(' ')) file.rows.push({ type: 'ctx', oldNo: oldNo++, newNo: newNo++, text: raw.slice(1) });
    else if (raw.startsWith('\\')) file.rows.push({ type: 'hunk', text: raw });
  }
  return files;
}
// A comment on the new side anchors to add/context lines; on the old side, to deleted lines
function rowAnchor(row) {
  if (row.type === 'del') return { side: 'old', line: row.oldNo };
  if (row.type === 'add' || row.type === 'ctx') return { side: 'new', line: row.newNo };
  return null;
}

// ---------- persistence (REVIEW.md via the local server) ----------
async function api(method, url, body) {
  const res = await fetch(url, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  const json = await res.json();
  if (!res.ok) throw new Error(json.error || res.statusText);
  return json;
}
async function save(next, message) {
  try {
    state.review = await api('PUT', '/api/review', next);
    state.openForm = null;
    render();
    toast(message + ' — saved to REVIEW.md');
    return true;
  } catch (err) {
    toast('Could not save: ' + err.message, true);
    return false;
  }
}
const withComments = (comments) => ({ ...state.review, comments });
const strip = ({ file, line, side, body }) => ({ file, line, side, body });

function addComment(file, side, line, body) {
  return save(withComments([...state.review.comments.map(strip), { file, side, line, body }]), 'Comment added');
}
function editComment(id, body) {
  return save(withComments(state.review.comments.map((c) => (c.id === id ? { ...strip(c), body } : strip(c)))), 'Comment updated');
}
function deleteComment(id) {
  if (!confirm('Delete this comment from REVIEW.md?')) return;
  save(withComments(state.review.comments.filter((c) => c.id !== id).map(strip)), 'Comment deleted');
}

// ---------- rendering ----------
function commentHtml(c) {
  if (state.openForm && state.openForm.editId === c.id) {
    return `<div class="form" data-form="edit" data-id="${c.id}">
      <textarea data-input autofocus>${esc(c.body)}</textarea>
      <div class="row"><span class="hint">Markdown supported · ⌘↵ to save</span>
        <button class="btn" data-action="cancel">Cancel</button><button class="btn primary" data-action="submit-edit">Update comment</button></div></div>`;
  }
  return `<div class="cmt">
    <div class="cmt-h">${avatar(ME, 20)} <b>${ME}</b> <span class="badge">Pending in REVIEW.md</span>
      <span class="actions"><button class="link-btn" data-action="edit" data-id="${c.id}">Edit</button><button class="link-btn del" data-action="delete" data-id="${c.id}">Delete</button></span></div>
    <div class="md">${markdown(c.body)}</div></div>`;
}
function newFormHtml(file, side, line) {
  return `<div class="form" data-form="new" data-file="${esc(file)}" data-side="${side}" data-line="${line}">
    <textarea data-input autofocus placeholder="Leave a comment on line ${line}${side === 'old' ? ' (removed)' : ''}"></textarea>
    <div class="row"><span class="hint">Markdown supported · ⌘↵ to save</span>
      <button class="btn" data-action="cancel">Cancel</button><button class="btn primary" data-action="submit-new">Add review comment</button></div></div>`;
}

function commentsByLine() {
  const map = new Map();
  for (const c of state.review.comments) {
    const k = lineKey(c.file, c.side, c.line);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(c);
  }
  return map;
}

function renderFiles() {
  const byLine = commentsByLine();
  const anchored = new Set();
  const collapsed = new Set([...document.querySelectorAll('.file.collapsed')].map((el) => el.dataset.path));

  $('#files').innerHTML = state.files.map((f) => {
    const total = f.add + f.del;
    const greens = total ? Math.round((f.add / total) * 5) : 0;
    const bars = [...Array(5)].map((_, i) => `<i class="${i < greens ? 'a' : i < 5 && f.del && i >= greens ? 'd' : ''}"></i>`).join('');
    const rows = f.rows.map((r) => {
      if (r.type === 'hunk') return `<tr class="hunk"><td class="num"></td><td class="num"></td><td class="mk"></td><td class="code">${esc(r.text)}</td></tr>`;
      const a = rowAnchor(r);
      const k = lineKey(f.path, a.side, a.line);
      const comments = byLine.get(k) || [];
      comments.forEach((c) => anchored.add(c.id));
      const formHere = state.openForm && state.openForm.key === k;
      const mark = r.type === 'add' ? '+' : r.type === 'del' ? '-' : ' ';
      let html = `<tr class="line ${r.type}" data-file="${esc(f.path)}" data-side="${a.side}" data-line="${a.line}">
        <td class="num old">${r.oldNo ?? ''}</td><td class="num new">${r.newNo ?? ''}</td>
        <td class="mk"><button class="add-btn" data-action="open" title="Add a comment">+</button>${mark}</td>
        <td class="code">${esc(r.text) || ' '}</td></tr>`;
      if (comments.length || formHere) {
        html += `<tr class="thread"><td colspan="4"><div class="thread-box">${comments.map(commentHtml).join('')}${
          formHere ? newFormHtml(f.path, a.side, a.line)
                   : comments.length ? `<div class="reply"><input data-action="open" placeholder="Add another comment on this line…" readonly></div>` : ''
        }</div></td></tr>`;
      }
      return html;
    }).join('');
    const n = state.review.comments.filter((c) => c.file === f.path).length;
    return `<div class="file${collapsed.has(f.path) ? ' collapsed' : ''}" id="${fileId(f.path)}" data-path="${esc(f.path)}">
      <div class="file-h"><button class="toggle" data-action="toggle">▾</button>
        <span style="color:var(--success)">+${f.add}</span><span style="color:var(--danger)">−${f.del}</span><span class="bars">${bars}</span>
        <span>${esc(f.path)}</span>${f.status !== 'modified' ? `<span class="label">${f.status}</span>` : ''}
        ${n ? `<span class="label">💬 ${n}</span>` : ''}</div>
      <table class="diff"><colgroup><col class="num"><col class="num"><col class="mk"><col></colgroup>${rows}</table></div>`;
  }).join('');

  // Comments in REVIEW.md that don't land on a line of the diff (typo'd path or line, or written by hand)
  const orphans = state.review.comments.filter((c) => !anchored.has(c.id));
  $('#orphans').innerHTML = orphans.length
    ? `<div class="orphans"><b>${orphans.length} comment${orphans.length > 1 ? 's' : ''} in REVIEW.md ${orphans.length > 1 ? "don't" : "doesn't"} match a line in this diff</b>
        <div class="thread-box" style="margin:8px 0 0;background:#fff">${orphans.map((c) => `<div style="padding:8px 16px 0" class="file-ref">${esc(c.file)}:${c.line}${c.side === 'old' ? ' (removed line)' : ''}</div>${commentHtml(c)}`).join('')}</div></div>`
    : '';

  $('#tree').innerHTML = renderTree();
  const focus = $('#files [data-input]') || $('#orphans [data-input]');
  if (focus) { focus.focus(); focus.setSelectionRange(focus.value.length, focus.value.length); }
}

function renderTree() {
  const groups = new Map();
  for (const f of state.files) {
    const dir = f.path.includes('/') ? f.path.slice(0, f.path.lastIndexOf('/')) : '';
    if (!groups.has(dir)) groups.set(dir, []);
    groups.get(dir).push(f);
  }
  return [...groups].map(([dir, fs]) => `<div class="dir">${esc(dir)}</div>` + fs.map((f) => {
    const n = state.review.comments.filter((c) => c.file === f.path).length;
    const color = f.status === 'added' ? 'var(--success)' : f.status === 'deleted' ? 'var(--danger)' : '#9a6700';
    return `<a href="#${fileId(f.path)}"><span style="color:${color}">●</span><span class="name">${esc(f.path.split('/').pop())}</span>${n ? `<span class="n">💬${n}</span>` : ''}</a>`;
  }).join('')).join('');
}

function renderConversation() {
  const { verdict, summary, comments } = state.review;
  const items = [`<div class="tl-item">${avatar('Morgan')}<div class="box"><div class="box-h"><b>Morgan</b> opened this pull request</div>
    <div class="box-b md">${markdown(state.description.replace(/^# .*\n/, ''))}</div></div></div>`];

  if (comments.length || summary.trim() || verdict !== 'Comment') {
    const cls = verdict === 'Approve' ? 'approve' : verdict === 'Request changes' ? 'request' : '';
    const verb = verdict === 'Approve' ? 'approved these changes' : verdict === 'Request changes' ? 'requested changes' : 'reviewed';
    const sorted = [...comments].sort((a, b) => a.file.localeCompare(b.file) || a.line - b.line);
    items.push(`<div class="tl-item">${avatar(ME)}<div class="box"><div class="box-h"><b>${ME}</b> ${verb} <span class="badge ${cls}">${esc(verdict)}</span>
        <span style="margin-left:auto" class="badge">REVIEW.md</span></div>
      <div class="box-b">${summary.trim() ? `<div class="md" style="margin-bottom:${comments.length ? 16 : 0}px">${markdown(summary)}</div>` : ''}
        ${sorted.map((c) => {
          const f = state.files.find((x) => x.path === c.file);
          const row = f && f.rows.find((r) => { const a = rowAnchor(r); return a && a.side === c.side && a.line === c.line; });
          const snippet = row ? `<table class="diff"><colgroup><col class="num"><col class="mk"><col></colgroup><tr class="line ${row.type}"><td class="num">${c.line}</td><td class="mk">${row.type === 'add' ? '+' : row.type === 'del' ? '-' : ' '}</td><td class="code">${esc(row.text)}</td></tr></table>` : '';
          return `<div class="snippet"><a class="file-ref" href="#${fileId(c.file)}" data-goto="${esc(c.file)}">${esc(c.file)}:${c.line}${c.side === 'old' ? ' (removed line)' : ''}</a>${snippet}
            <div class="cmt" style="border-top:1px solid var(--border-muted)"><div class="md">${markdown(c.body)}</div></div></div>`;
        }).join('')}
        ${!summary.trim() && !comments.length ? '<span class="empty">No summary yet.</span>' : ''}</div></div></div>`);
  }
  $('#timeline').innerHTML = items.join('');
}

function render() {
  const add = state.files.reduce((a, f) => a + f.add, 0), del = state.files.reduce((a, f) => a + f.del, 0);
  $('#count-files').textContent = state.files.length;
  $('#count-conv').textContent = state.review.comments.length;
  $('#diffstat').innerHTML = `<span class="a">+${add}</span> <span class="d">−${del}</span>`;
  $('#files-summary').textContent = `${state.files.length} files · ${state.review.comments.length} comment${state.review.comments.length === 1 ? '' : 's'} · verdict: ${state.review.verdict}`;
  renderConversation();
  renderFiles();
}

// ---------- events ----------
function showTab(name) {
  document.querySelectorAll('.pr-tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === name));
  $('#tab-conversation').classList.toggle('hidden', name !== 'conversation');
  $('#tab-files').classList.toggle('hidden', name !== 'files');
  history.replaceState(null, '', name === 'files' ? '#files' : '#');
}
document.querySelectorAll('.pr-tabs button').forEach((b) => b.addEventListener('click', () => showTab(b.dataset.tab)));
$('#timeline').addEventListener('click', (e) => {
  const link = e.target.closest('[data-goto]');
  if (!link) return;
  e.preventDefault();
  showTab('files');
  document.getElementById(fileId(link.dataset.goto))?.scrollIntoView();
});

function formIsDirty() {
  const input = document.querySelector('[data-input]');
  if (!input) return false;
  const form = input.closest('[data-form]');
  if (form.dataset.form === 'new') return input.value.trim() !== '';
  const c = state.review.comments.find((x) => x.id === +form.dataset.id);
  return c && input.value !== c.body;
}

async function onAction(el) {
  const action = el.dataset.action;
  const row = el.closest('tr.line') || el.closest('tr.thread')?.previousElementSibling;
  if (action === 'toggle') return el.closest('.file').classList.toggle('collapsed');
  if (action === 'open') {
    if (formIsDirty() && !confirm('Discard the comment you are writing?')) return;
    const { file, side, line } = row.dataset;
    state.openForm = { key: lineKey(file, side, +line) };
    return renderFiles();
  }
  if (action === 'edit') {
    if (formIsDirty() && !confirm('Discard the comment you are writing?')) return;
    state.openForm = { editId: +el.dataset.id };
    return renderFiles();
  }
  if (action === 'cancel') { state.openForm = null; return renderFiles(); }
  if (action === 'delete') return deleteComment(+el.dataset.id);
  const form = el.closest('[data-form]');
  const body = $('[data-input]', form).value;
  if (!body.trim()) return toast('Write something first', true);
  el.disabled = true;
  const ok = action === 'submit-new'
    ? await addComment(form.dataset.file, form.dataset.side, +form.dataset.line, body)
    : await editComment(+form.dataset.id, body);
  if (!ok) el.disabled = false;
}
for (const root of [$('#files'), $('#orphans')]) {
  root.addEventListener('click', (e) => { const el = e.target.closest('[data-action]'); if (el) onAction(el); });
  root.addEventListener('keydown', (e) => {
    if (!e.target.matches('[data-input]')) return;
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); e.target.closest('[data-form]').querySelector('.btn.primary').click(); }
    if (e.key === 'Escape') { state.openForm = null; renderFiles(); }
  });
}
$('#expand-all').addEventListener('click', () => document.querySelectorAll('.file').forEach((f) => f.classList.remove('collapsed')));
$('#collapse-all').addEventListener('click', () => document.querySelectorAll('.file').forEach((f) => f.classList.add('collapsed')));

// review summary / verdict
const pop = $('#review-pop');
$('#review-btn').addEventListener('click', () => {
  if (!pop.classList.contains('hidden')) return pop.classList.add('hidden');
  $('#review-summary').value = state.review.summary;
  document.querySelectorAll('input[name=verdict]').forEach((r) => (r.checked = r.value === state.review.verdict));
  pop.classList.remove('hidden');
  $('#review-summary').focus();
});
$('#review-cancel').addEventListener('click', () => pop.classList.add('hidden'));
$('#review-submit').addEventListener('click', async () => {
  const verdict = document.querySelector('input[name=verdict]:checked')?.value || 'Comment';
  const ok = await save({ ...state.review, comments: state.review.comments.map(strip), verdict, summary: $('#review-summary').value }, 'Review submitted');
  if (ok) pop.classList.add('hidden');
});

// Pick up edits made to REVIEW.md by hand when you come back to the tab (unless you're mid-comment)
window.addEventListener('focus', async () => {
  if (document.querySelector('[data-input]') || !pop.classList.contains('hidden')) return;
  try {
    const fresh = await api('GET', '/api/review');
    if (JSON.stringify(fresh) !== JSON.stringify(state.review)) { state.review = fresh; render(); toast('Reloaded REVIEW.md'); }
  } catch { /* server stopped; keep what we have */ }
});

(async () => {
  try {
    const [pr, review] = await Promise.all([api('GET', '/api/pr'), api('GET', '/api/review')]);
    state.description = pr.description;
    state.files = parseDiff(pr.diff);
    state.review = review;
    render();
    if (location.hash === '#files') showTab('files');
  } catch (err) {
    document.querySelector('.wrap').insertAdjacentHTML('afterbegin', `<div class="orphans">Couldn't load the PR: ${esc(err.message)}. Is <code>node review/viewer/server.mjs</code> running?</div>`);
  }
})();
</script>
</body>
</html>
