# env vars override where noted

play.http.secret.key = "local-development-only-secret-not-used-in-any-environment"
play.http.secret.key = ${?APPLICATION_SECRET}

# only other services call us so there are no browser sessions (no csrf), and the
# payments api reaches us by its container name
play.filters.disabled += "play.filters.csrf.CSRFFilter"
play.filters.hosts.allowed = ["."]

surcharge {
  bins.resource = "bins.csv.gz"
  merchants.resource = "merchants.json"
}
